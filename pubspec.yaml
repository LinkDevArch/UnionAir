name: union_air
description: Prototipo de búsqueda y reserva de vuelos UnionAir.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.14.0
  flutter: '>=3.50.1'

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.11.0
  flutter_svg: ^2.4.0

dev_dependencies:
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/Poppins-Light.ttf
          weight: 300
        - asset: assets/Poppins-Regular.ttf
        - asset: assets/Poppins-Medium.ttf
          weight: 500
        - asset: assets/Poppins-SemiBold.ttf
          weight: 600
    - family: 'DejaVu UI Symbols'
      fonts:
        - asset: assets/DejaVu-UI-Symbols.ttf
